[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "orbitdesk-lora-lab"
version = "1.0.0"
description = "A measurable, local PyTorch LoRA fine-tuning experiment"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
