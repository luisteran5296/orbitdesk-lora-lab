name: Data and pipeline integrity
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt && pip install -e . --no-deps
      - run: python -m pytest -q
      - run: python -m ruff check src tests app.py
      - run: python -m ruff format --check src tests app.py
